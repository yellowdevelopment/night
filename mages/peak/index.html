<body>
  <div id="wrap">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="bar">
      <div id="barfill"></div>
    </div>

    <div id="msg">Loading…</div>
  </div>

  <div id="credit">
    ported by @._.dasher._.<br>

    </a>
  </div>

  <script>
    var MANIFEST = {
      "data": {
        "file": "WebGL.data.unityweb",
        "parts": [
          "WebGL.data.unityweb.part000",
          "WebGL.data.unityweb.part001",
          "WebGL.data.unityweb.part002",
          "WebGL.data.unityweb.part003",
          "WebGL.data.unityweb.part004",
          "WebGL.data.unityweb.part005",
          "WebGL.data.unityweb.part006",
          "WebGL.data.unityweb.part007",
          "WebGL.data.unityweb.part008",
          "WebGL.data.unityweb.part009",
          "WebGL.data.unityweb.part010",
          "WebGL.data.unityweb.part011",
          "WebGL.data.unityweb.part012"
        ],
        "bytes": 241608952
      },

      "code": {
        "file": "WebGL.wasm.unityweb",
        "bytes": 12657365
      },

      "framework": {
        "file": "WebGL.framework.js.unityweb",
        "bytes": 85982
      },

      "loader": {
        "file": "WebGL.loader.js",
        "bytes": 117365
      }
    };

    var BUILD = "Build";

    var CDN_BASE =
      "https://cdn.jsdelivr.net/gh/wasmdotrip/Peak-Port@main";

    if (CDN_BASE) {
      var u = new URL(window.location.href);

      if (u.searchParams.get("cdn") !== CDN_BASE) {
        u.searchParams.set("cdn", CDN_BASE);
        history.replaceState(null, "", u.toString());
      }
    }

    var canvas = document.querySelector("#unity-canvas");
    var bar = document.querySelector("#bar");
    var barfill = document.querySelector("#barfill");
    var msg = document.querySelector("#msg");

    function setMsg(t) {
      msg.textContent = t;
    }

    function mb(bytes) {
      return (bytes / 1048576).toFixed(1);
    }

    var TOTAL =
      MANIFEST.data.bytes +
      MANIFEST.framework.bytes +
      MANIFEST.code.bytes;

    var downloaded = 0;

    function report(label) {
      bar.style.display = "block";

      var pct = TOTAL ? downloaded / TOTAL : 0;

      barfill.style.width =
        (pct * 100).toFixed(1) + "%";

      setMsg(
        "Downloading " +
        label +
        "… " +
        mb(downloaded) +
        " / " +
        mb(TOTAL) +
        " MB (" +
        Math.floor(pct * 100) +
        "%)"
      );
    }

    async function assemble(entry, label) {
      var urls = entry.parts || [entry.file];
      var buffers = [];

      for (var i = 0; i < urls.length; i++) {
        var url = BUILD + "/" + urls[i];

        var res = await fetch(url);

        if (!res.ok) {
          throw new Error(
            "failed to fetch " +
            url +
            " (" +
            res.status +
            ")"
          );
        }

        if (res.body && res.body.getReader) {
          var reader = res.body.getReader();

          while (true) {
            var step = await reader.read();

            if (step.done) break;

            buffers.push(step.value);

            downloaded += step.value.byteLength;

            report(label);
          }
        } else {
          var buf = await res.arrayBuffer();

          buffers.push(buf);

          downloaded += buf.byteLength;

          report(label);
        }
      }

      return URL.createObjectURL(
        new Blob(buffers)
      );
    }

    (async function () {
      try {
        var dataUrl =
          await assemble(MANIFEST.data, "game data");

        var frameworkUrl =
          await assemble(MANIFEST.framework, "framework");

        var codeUrl =
          await assemble(MANIFEST.code, "code");

        setMsg("Starting…");

        var script =
          document.createElement("script");

        script.src =
          BUILD + "/" + MANIFEST.loader.file;

        script.onload = function () {
          createUnityInstance(
            canvas,
            {
              dataUrl: dataUrl,
              frameworkUrl: frameworkUrl,
              codeUrl: codeUrl,
              streamingAssetsUrl: "StreamingAssets",

              companyName:
                "Aggro Crab & Landfall",

              productName: "PEAK",

              productVersion: "1.62.a"
            },

            function (p) {
              bar.style.display = "block";

              barfill.style.width =
                Math.round(p * 100) + "%";

              setMsg(
                "Loading… " +
                Math.round(p * 100) +
                "%"
              );
            }
          )
          .then(function (instance) {
            window.unityInstance = instance;

            bar.style.display = "none";
            setMsg("");

            canvas.focus();

            // Keep the canvas fullscreen-sized
            function resizeCanvas() {
              canvas.style.width = "100vw";
              canvas.style.height = "100vh";
            }

            resizeCanvas();

            window.addEventListener(
              "resize",
              resizeCanvas
            );

            window.addEventListener(
              "orientationchange",
              resizeCanvas
            );
          })
          .catch(function (e) {
            setMsg(
              "Failed to start: " + e
            );
          });
        };

        script.onerror = function () {
          setMsg(
            "Failed to load " +
            script.src
          );
        };

        document.body.appendChild(script);

      } catch (e) {
        setMsg(String(e));
      }
    })();
  </script>
</body>
</html>
