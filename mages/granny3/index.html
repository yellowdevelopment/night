<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/skibbsz/jsdelivr-cdns@main/granny3/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Granny 3</title>
  <style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#231F20}#unity-canvas{width:100%;height:100%;display:block}._wmr{position:fixed;top:6px;right:8px;z-index:9999;text-align:right;pointer-events:none;font-family:Arial,sans-serif}._wmr ._wmr-a{font-size:13px;font-weight:700;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.8),0 0 8px rgba(0,0,0,.5)}._wmr ._wmr-b{font-size:10px;font-weight:400;color:#ccc;text-shadow:0 0 3px rgba(0,0,0,.8)}</style><link rel="manifest" href="manifest.webmanifest"></head>
  <body>
    <script>
      window.fileMergerConfig = {
        files: [
          { name: 'FinalBuild.wasm', parts: 2 },
          { name: 'FinalBuild.data', parts: 20 },
        ],
        basePath: 'Build/',
        debug: true
      };
    </script>
    <script src="https://cdn.jsdelivr.net/gh/skibbsz/jsdelivr-cdns@main/merge.js" ></script>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/FinalBuild.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/FinalBuild.data",
        frameworkUrl: "Build/FinalBuild.framework.js",
        codeUrl: "Build/FinalBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DVloper",
        productName: "Granny 3",
        productVersion: "1.2",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      });
    </script>
</html>
